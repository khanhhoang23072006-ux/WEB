<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚔️ ARENA - Nền tảng Giải đấu Mini</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0d0d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARENA">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="img/favicon.jpg">
  <link rel="apple-touch-icon" href="img/favicon.jpg">
</head>
<body>

  <!-- Background Effects -->
  <div class="bg-vignette"></div>
  <div class="bg-stripes"></div>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="#/" class="nav-brand"><img src="img/icon-play.png" alt="Arena Logo" style="width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));"> ARENA</a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    <div class="nav-links">
      <div id="auth-section" style="display: inline-block; margin-left: 1rem;"></div>
    </div>
  </nav>

  <!-- Donate Marquee -->
  <div id="donate-marquee-container" class="donate-marquee-wrapper" style="display: none;">
    <div class="donate-marquee">
      <span id="donate-marquee-text"></span>
    </div>
  </div>

  <!-- Main Content -->
  <main id="app" class="container">
  </main>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Side Navigation Bar -->
  <nav class="side-nav" id="bottom-nav">
    <a href="#/" class="snav-item active" id="bnav-home">
      <div class="snav-icon">
        <img src="img/icon-shop.png" alt="Home" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <span>Trang chủ</span>
    </a>
    <a href="#/create" class="snav-item" id="bnav-create" style="display:none;">
      <div class="snav-icon">
        <img src="img/icon-play.png" alt="Create" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <span>Tạo giải</span>
    </a>
    <a href="#/stats" class="snav-item" id="bnav-stats">
      <div class="snav-icon">
        <img src="img/icon-deck.png" alt="Stats" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <span>Thống kê</span>
    </a>
    <a href="#/search" class="snav-item" id="bnav-search">
      <div class="snav-icon">
        <img src="img/icon-portal.png" alt="Search" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <span>Tìm kiếm</span>
    </a>
  </nav>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-logo">
        <img src="img/icon-play.png" alt="Arena Logo">
        <span>ARENA</span>
      </div>
      <div class="footer-links">
        <a href="#/">TRANG CHỦ</a>
        <a href="#/stats">THỐNG KÊ</a>
        <a href="#/search">TÌM KIẾM</a>
      </div>
      <div class="footer-social">
        <a href="https://www.facebook.com/bourbon.gk" target="_blank" class="social-icon" style="padding: 0.2rem; display: flex; align-items: center; justify-content: center; background: transparent; border: none; box-shadow: none;">
          <img src="https://static.vecteezy.com/system/resources/previews/018/930/698/original/facebook-logo-facebook-icon-transparent-free-png.png" alt="Facebook 3D" style="width: 48px; height: 48px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
        </a>
        <a href="javascript:void(0)" class="social-icon" style="color: #FF0000; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px;">Yt</a>
        <a href="javascript:void(0)" class="social-icon" style="color: #5865F2; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px;">Dc</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 ARENA. Nền tảng quản lý giải đấu Mini.</p>
      <p class="disclaimer">Sản phẩm này không liên quan, không được tài trợ hay phê duyệt bởi Supercell.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error("JS Error:", msg, "Line:", lineNo, "Col:", columnNo);
      return false;
    };
  </script>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/bracket.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cursor-effect.js"></script>
  
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>

</body>
</html>
